# From https://github.com/wjh720/QPLEX/
# --- Qatten specific parameters ---
checkpoint_path: "/Users/zhuofan.xu/Downloads/smac2_results/models/sc2_corridor-obs_aid=1-obs_act=0/algo=qplex_cent_pet-agent=n_rnn_cent_pet/env_n=16/rnn_dim=64-2bs=5000_128-tdlambda=0.6-epdec_0.05=100k/qplex_cent_pet__2025-07-21_00-55-43"
evaluate: True # Evaluate model for test_nepisode episodes and quit (no training)
load_step: 0 # Load model trained on this many timesteps (0 if choose max possible)
save_replay: True # Save the replay of the model loaded from checkpoint_path
test_nepisode: 5 # Number of episodes to test for
env_args:
  replay_dir: "results/replays" # Directory to save replays (local)
  replay_prefix: "qplex_cent_pet_replay" # Prefix for replay files

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 500000 for 6h_vs_8z

runner: "parallel"
batch_size_run: 1
buffer_size: 5000
batch_size: 128

# update the target network every {} episodes
target_update_interval: 200
t_max: 10050000

# use the Q_Learner to train
mac: "n_mac"
agent: "n_rnn_cent_pet"
rnn_hidden_dim: 64 # Size of hidden state for default rnn agent
agent_output_type: "q"

learner: "dmaq_qatten_learner"
double_q: True
mixer: "dmaq"
mixing_embed_dim: 32
hypernet_embed: 64
adv_hypernet_layers: 2
adv_hypernet_embed: 64
td_lambda: 0.6
lr: 0.001

num_kernel: 4
is_minus_one: True
weighted_head: True
is_adv_attention: True
is_stop_gradient: True

name: "qplex_cent_pet"

obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: False # Include the agent's last action (one_hot) in the observation